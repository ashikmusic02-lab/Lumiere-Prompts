name: Build PromptLens

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      build_release:
        description: "Also build the signed release AAB + APK (needs the keystore secrets)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The repository has no gradlew, so Gradle itself is installed here (same version as gradle-wrapper.properties).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Check google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "::warning::app/google-services.json is missing. The app will build but Firebase will NOT work. Download it from Firebase Console and upload it into the app/ folder."
          fi

      # Optional build-time values. Only secrets that you actually set are written; everything else keeps the defaults from .env.example.
      - name: Create .env from secrets
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
          ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}
          ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_UNIT_ID }}
          OFFICIAL_PLAY_STORE_URL: ${{ secrets.OFFICIAL_PLAY_STORE_URL }}
          FIREBASE_APPCHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APPCHECK_DEBUG_TOKEN }}
        run: |
          : > .env
          for k in ONESIGNAL_APP_ID ADMOB_BANNER_AD_UNIT_ID ADMOB_REWARDED_AD_UNIT_ID ADMOB_INTERSTITIAL_AD_UNIT_ID OFFICIAL_PLAY_STORE_URL FIREBASE_APPCHECK_DEBUG_TOKEN; do
            v="${!k}"
            if [ -n "$v" ]; then
              echo "$k=$v" >> .env
            fi
          done

      # A fixed debug key keeps the debug SHA-1 stable, which Google sign-in needs.
      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret is not set. A temporary debug keystore is generated, so its SHA-1 changes on every run and Google sign-in will not stay working."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "---- DEBUG key fingerprints (add these to Firebase) ----"
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1|SHA256"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: promptlens-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Prepare release keystore
        if: ${{ github.event.inputs.build_release == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_BASE64 and STORE_PASSWORD secrets are required for a release build."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "---- RELEASE (upload) key fingerprints (add these to Firebase) ----"
          keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -storepass "$STORE_PASSWORD" -alias upload | grep -E "SHA1|SHA256"

      - name: Build signed release AAB and APK
        if: ${{ github.event.inputs.build_release == 'true' }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease assembleRelease --stacktrace

      - name: Upload release files
        if: ${{ github.event.inputs.build_release == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: promptlens-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          retention-days: 7
